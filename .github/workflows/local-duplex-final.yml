name: Local Duplex Final APK

on:
  pull_request:
    branches: [ main ]
  push:
    branches:
      - 'tmp/local-duplex-final-*'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android command-line tools
        run: |
          set -euxo pipefail
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fL --retry 3 \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip \
            -o /tmp/cmdline-tools.zip
          rm -rf /tmp/android-cli
          mkdir -p /tmp/android-cli
          unzip -q /tmp/cmdline-tools.zip -d /tmp/android-cli
          mv /tmp/android-cli/cmdline-tools "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install SDK, NDK and CMake
        run: |
          set -euxo pipefail
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null || true
          sdkmanager --channel=3 --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-37.2" \
            "build-tools;37.0.0" \
            "ndk;29.0.13113456" \
            "cmake;3.31.6"

      - name: Reconstruct project
        run: |
          set -euxo pipefail
          cat .build-local-duplex-final/chunk*.b64 | base64 -d > /tmp/project.zip
          echo "e645c5676d48163be8e743147dce8fb049c7abdffab897a94db80475e39bd74f  /tmp/project.zip" | sha256sum -c -
          mkdir -p /tmp/project
          unzip -q /tmp/project.zip -d /tmp/project

      - name: Fetch sherpa-onnx AAR
        run: |
          set -euxo pipefail
          mkdir -p /tmp/project/app/libs
          curl -fL --retry 4 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar \
            -o /tmp/project/app/libs/sherpa-onnx-1.13.8.aar
          echo "633c24321e06b1fe79feafa03ea16cbc0f8a286641e2da3559bac91bdb13bd96  /tmp/project/app/libs/sherpa-onnx-1.13.8.aar" | sha256sum -c -

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Build APK
        run: |
          set -euxo pipefail
          cd /tmp/project
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: APK digest
        run: sha256sum /tmp/project/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalDuplexAgent-Final-debug
          path: /tmp/project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
