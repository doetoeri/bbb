name: Local Duplex Final APK

on:
  push:
    branches:
      - tmp/local-duplex-final-20260928-r1

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android command-line tools
        run: |
          set -euxo pipefail
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fL --retry 3             https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip             -o /tmp/cmdline-tools.zip
          rm -rf /tmp/android-cli
          mkdir -p /tmp/android-cli
          unzip -q /tmp/cmdline-tools.zip -d /tmp/android-cli
          mv /tmp/android-cli/cmdline-tools "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Install SDK, NDK and CMake
        run: |
          set -euxo pipefail
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null || true
          sdkmanager --channel=3 --sdk_root="$ANDROID_SDK_ROOT"             "platform-tools"             "platforms;android-37.2"             "build-tools;37.0.0"             "ndk;29.0.13113456"             "cmake;3.31.6"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Reconstruct source
        run: |
          set -euxo pipefail
          cat .build-local-duplex-final/chunk*.b64 | base64 -d > /tmp/source.zip
          echo "61ce3db89a71ff20ab39b5e1982098a5c4631fa552839710a869edcc760e59db  /tmp/source.zip" | sha256sum -c -
          mkdir -p /tmp/work
          unzip -q /tmp/source.zip -d /tmp/work
          test -f /tmp/work/LocalDuplexAgent-Final/app/build.gradle.kts
          cp "$GITHUB_WORKSPACE/.build-local-duplex-final-overrides/ModelStore.kt" \
            /tmp/work/LocalDuplexAgent-Final/app/src/main/java/dev/localduplex/agent/model/ModelStore.kt
          python3 - <<'PY'
from pathlib import Path
p = Path("/tmp/work/LocalDuplexAgent-Final/app/src/main/java/dev/localduplex/agent/MainActivity.kt")
s = p.read_text()

if "import androidx.compose.material3.LinearProgressIndicator" not in s:
    s = s.replace(
        "import androidx.compose.material3.ExperimentalMaterial3Api\n",
        "import androidx.compose.material3.ExperimentalMaterial3Api\nimport androidx.compose.material3.LinearProgressIndicator\n"
    )

if "import dev.localduplex.agent.model.ImportStage" not in s:
    s = s.replace(
        "import dev.localduplex.agent.conversation.TurnMode\n",
        "import dev.localduplex.agent.conversation.TurnMode\nimport dev.localduplex.agent.model.ImportStage\n"
    )

anchor = '            Text(state.modelStatus.message, color = MaterialTheme.colorScheme.onSurfaceVariant)\n'
block = '''            Text(state.modelStatus.message, color = MaterialTheme.colorScheme.onSurfaceVariant)
            state.modelStatus.progress?.let { p ->
                if (state.modelStatus.importing || p.stage == ImportStage.COMPLETE || p.stage == ImportStage.FAILED) {
                    if (p.totalBytes > 0 && p.stage != ImportStage.VERIFYING && p.stage != ImportStage.FAILED) {
                        LinearProgressIndicator(
                            progress = { p.fraction.coerceIn(0f, 1f) },
                            modifier = Modifier.fillMaxWidth()
                        )
                    } else if (state.modelStatus.importing && p.stage == ImportStage.VERIFYING) {
                        LinearProgressIndicator(modifier = Modifier.fillMaxWidth())
                    }
                    Text(importProgressText(p), style = MaterialTheme.typography.bodySmall, fontFamily = FontFamily.Monospace)
                    if (p.detail.isNotBlank()) {
                        Text(p.detail, style = MaterialTheme.typography.labelSmall, color = MaterialTheme.colorScheme.onSurfaceVariant)
                    }
                }
            }
'''
if "state.modelStatus.progress?.let" not in s:
    if anchor not in s:
        raise SystemExit("ModelCard anchor not found")
    s = s.replace(anchor, block, 1)

helpers = '''private fun importProgressText(p: dev.localduplex.agent.model.ImportProgress): String {
    val stage = when (p.stage) {
        ImportStage.COPYING -> "복사"
        ImportStage.EXTRACTING -> "압축 해제"
        ImportStage.VERIFYING -> "검증"
        ImportStage.COMPLETE -> "완료"
        ImportStage.FAILED -> "실패"
    }
    val percent = if (p.totalBytes > 0) ((p.fraction * 100).roundToInt()).toString() + "%" else "진행 중"
    val bytes = if (p.totalBytes > 0) formatBytes(p.processedBytes) + " / " + formatBytes(p.totalBytes) else formatBytes(p.processedBytes)
    val speed = if (p.bytesPerSecond > 0) " · " + formatBytes(p.bytesPerSecond) + "/s" else ""
    val eta = if (p.etaSeconds >= 0 && p.stage != ImportStage.COMPLETE) " · 약 " + formatEta(p.etaSeconds) + " 남음" else ""
    return stage + " " + percent + " · " + bytes + speed + eta
}

private fun formatBytes(bytes: Long): String {
    if (bytes < 0) return "-"
    val mib = bytes / (1024.0 * 1024.0)
    return if (mib >= 1024.0) "%.2f GB".format(mib / 1024.0) else "%.1f MB".format(mib)
}

private fun formatEta(seconds: Long): String {
    if (seconds < 60) return seconds.toString() + "초"
    val minutes = seconds / 60
    val remain = seconds % 60
    return if (remain == 0L) minutes.toString() + "분" else minutes.toString() + "분 " + remain.toString() + "초"
}

'''
if "private fun importProgressText" not in s:
    marker = "private fun fmt(ms: Long): String"
    i = s.find(marker)
    if i < 0:
        raise SystemExit("fmt marker not found")
    s = s[:i] + helpers + s[i:]

p.write_text(s)
PY
          grep -q "ImportProgress" /tmp/work/LocalDuplexAgent-Final/app/src/main/java/dev/localduplex/agent/model/ModelStore.kt
          grep -q "LinearProgressIndicator" /tmp/work/LocalDuplexAgent-Final/app/src/main/java/dev/localduplex/agent/MainActivity.kt

      - name: Fetch pinned offline runtime dependencies
        run: |
          set -euxo pipefail
          cd /tmp/work/LocalDuplexAgent-Final
          mkdir -p app/libs app/src/main/assets
          curl -fL --retry 3             https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar             -o app/libs/sherpa-onnx-1.13.8.aar
          echo "633c24321e06b1fe79feafa03ea16cbc0f8a286641e2da3559bac91bdb13bd96  app/libs/sherpa-onnx-1.13.8.aar" | sha256sum -c -
          curl -fL --retry 3             https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx             -o app/src/main/assets/silero_vad.onnx
          test -s app/src/main/assets/silero_vad.onnx

      - name: Build APK
        run: |
          set -euxo pipefail
          cd /tmp/work/LocalDuplexAgent-Final
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          set -euxo pipefail
          APK=/tmp/work/LocalDuplexAgent-Final/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalDuplexAgent-Final-debug
          path: /tmp/work/LocalDuplexAgent-Final/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
