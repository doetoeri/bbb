name: Local Duplex APK Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - tmp/local-duplex-apk-20260928
    paths:
      - '.github/workflows/local-duplex-apk.yml'
      - '.build-local-duplex/**'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-37" \
            "build-tools;37.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Reconstruct project
        run: |
          cat .build-local-duplex/chunk01.b64 \
              .build-local-duplex/chunk02.b64 \
              .build-local-duplex/chunk03.b64 \
              .build-local-duplex/chunk04.b64 \
              .build-local-duplex/chunk05.b64 \
            | base64 -d > /tmp/project.zip
          echo "Project archive SHA-256:"
          sha256sum /tmp/project.zip
          unzip -q /tmp/project.zip -d /tmp/work
          test -f /tmp/work/LocalDuplexAgent-Phase1/app/build.gradle.kts

      - name: Build debug APK
        run: |
          cd /tmp/work/LocalDuplexAgent-Phase1
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalDuplexAgent-Phase1-debug
          path: /tmp/work/LocalDuplexAgent-Phase1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
