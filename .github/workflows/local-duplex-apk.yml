name: Local Duplex APK Build

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android command-line tools
        run: |
          set -euxo pipefail
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fL --retry 3 \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip \
            -o /tmp/cmdline-tools.zip
          rm -rf /tmp/android-cli
          mkdir -p /tmp/android-cli
          unzip -q /tmp/cmdline-tools.zip -d /tmp/android-cli
          mv /tmp/android-cli/cmdline-tools "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          set -euxo pipefail
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Reconstruct project
        run: |
          set -euxo pipefail
          cat .build-local-duplex/chunk01.b64 \
              .build-local-duplex/chunk02.b64 \
              .build-local-duplex/chunk03.b64 \
              .build-local-duplex/chunk04.b64 \
              .build-local-duplex/chunk05.b64 \
            | base64 -d > /tmp/project.zip
          sha256sum /tmp/project.zip
          unzip -q /tmp/project.zip -d /tmp/work
          test -f /tmp/work/LocalDuplexAgent-Phase1/app/build.gradle.kts
          sed -i 's/compileSdk = 37/compileSdk = 36/' /tmp/work/LocalDuplexAgent-Phase1/app/build.gradle.kts

      - name: Build debug APK
        run: |
          cd /tmp/work/LocalDuplexAgent-Phase1
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalDuplexAgent-Phase1-debug
          path: /tmp/work/LocalDuplexAgent-Phase1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
