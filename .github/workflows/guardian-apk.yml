name: Guardian APK Build

on:
  push:
    branches: [ guardian-build ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore Guardian source
        run: |
          mkdir -p guardian-src
          base64 -d guardian-ci-src.tgz.b64 > guardian-ci-src.tgz
          tar -xzf guardian-ci-src.tgz -C guardian-src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Build, test, lint
        working-directory: guardian-src
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :device:assembleDebug :device:testDebugUnitTest :device:lintDebug :parent:assembleDebug :parent:lintDebug --stacktrace | tee verification-ci.log
      - name: Stage artifacts
        working-directory: guardian-src
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          DEVICE_APK="$(find device/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          PARENT_APK="$(find parent/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$DEVICE_APK"
          test -n "$PARENT_APK"
          cp "$DEVICE_APK" artifacts/Guardian-Device-debug.apk
          cp "$PARENT_APK" artifacts/Guardian-Parent-debug.apk
          sha256sum artifacts/Guardian-Device-debug.apk | tee artifacts/Guardian-Device-debug.sha256
          sha256sum artifacts/Guardian-Parent-debug.apk | tee artifacts/Guardian-Parent-debug.sha256
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Guardian-live
          path: |
            guardian-src/artifacts/Guardian-Device-debug.apk
            guardian-src/artifacts/Guardian-Device-debug.sha256
            guardian-src/artifacts/Guardian-Parent-debug.apk
            guardian-src/artifacts/Guardian-Parent-debug.sha256
            guardian-src/verification-ci.log
          if-no-files-found: error

  emulator:
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download built APKs
        uses: actions/download-artifact@v4
        with:
          name: Guardian-live
          path: guardian-artifact
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -eu
            DEVICE_APK="$(find guardian-artifact -type f -name 'Guardian-Device-debug.apk' | head -n 1)"
            PARENT_APK="$(find guardian-artifact -type f -name 'Guardian-Parent-debug.apk' | head -n 1)"
            test -n "$DEVICE_APK"
            test -n "$PARENT_APK"

            adb install -r "$DEVICE_APK"
            adb shell pm path app.guardian.device
            adb logcat -c
            adb shell am start -W -n app.guardian.device/.MainActivity
            sleep 5
            DEVICE_PID="$(adb shell pidof app.guardian.device | tr -d '\r')"
            test -n "$DEVICE_PID"
            echo "Guardian Device PID: $DEVICE_PID"
            adb shell dumpsys package app.guardian.device | grep -E 'versionName=|versionCode='
            adb shell dumpsys activity activities | grep -F 'app.guardian.device/.MainActivity'

            adb shell dpm set-device-owner app.guardian.device/.GuardianAdminReceiver
            adb shell dumpsys device_policy | grep -F 'app.guardian.device/.GuardianAdminReceiver'
            echo "DEVICE_OWNER_VALIDATION_SUCCESS"

            adb install -r "$PARENT_APK"
            adb shell pm path app.guardian.parent
            adb shell am start -W -n app.guardian.parent/.MainActivity
            sleep 8
            PARENT_PID="$(adb shell pidof app.guardian.parent | tr -d '\r')"
            test -n "$PARENT_PID"
            echo "Guardian Parent PID: $PARENT_PID"
            adb shell dumpsys package app.guardian.parent | grep -E 'versionName=|versionCode='
            adb shell dumpsys activity activities | grep -F 'app.guardian.parent/.MainActivity'

            LOG="$(adb logcat -d -v brief)"
            printf '%s\n' "$LOG" > guardian-logcat.txt
            if printf '%s\n' "$LOG" | grep -E 'Process: app\.guardian\.(device|parent)'; then
              echo "Guardian crash detected"
              exit 1
            fi
            echo "EMULATOR_VALIDATION_SUCCESS" | tee emulator-validation.txt
      - name: Upload emulator validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Guardian-emulator-validation
          path: |
            emulator-validation.txt
            guardian-logcat.txt
          if-no-files-found: warn
