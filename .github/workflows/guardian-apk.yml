name: Guardian APK Build

on:
  push:
    branches: [ guardian-build ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore Guardian source
        run: |
          mkdir -p guardian-src
          base64 -d guardian-ci-src.tgz.b64 > guardian-ci-src.tgz
          tar -xzf guardian-ci-src.tgz -C guardian-src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Build, test, lint
        working-directory: guardian-src
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :device:assembleDebug :device:testDebugUnitTest :device:lintDebug --stacktrace | tee verification-ci.log
      - name: Stage artifact
        working-directory: guardian-src
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          APK="$(find device/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" artifacts/Guardian-debug.apk
          sha256sum artifacts/Guardian-debug.apk | tee artifacts/Guardian-debug.sha256
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Guardian-debug
          path: |
            guardian-src/artifacts/Guardian-debug.apk
            guardian-src/artifacts/Guardian-debug.sha256
            guardian-src/verification-ci.log
          if-no-files-found: error

  emulator:
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: Guardian-debug
          path: guardian-artifact
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -eu
            exec > >(tee emulator-validation.txt) 2>&1
            APK="$(find guardian-artifact -type f -name 'Guardian-debug.apk' | head -n 1)"
            test -n "$APK"
            adb install -r "$APK"
            adb shell pm path app.guardian.device
            adb logcat -c
            adb shell am start -W -n app.guardian.device/.MainActivity
            sleep 5
            PID="$(adb shell pidof app.guardian.device | tr -d '\r')"
            test -n "$PID"
            echo "Guardian PID: $PID"
            adb shell dumpsys package app.guardian.device | grep -E 'versionName=|versionCode='
            adb shell dumpsys activity activities | grep -F 'app.guardian.device/.MainActivity'
            LOG="$(adb logcat -d -v brief)"
            echo "$LOG" > guardian-logcat.txt
            if echo "$LOG" | grep -E 'FATAL EXCEPTION.*app\.guardian\.device|Process: app\.guardian\.device'; then
              echo "Guardian crash detected"
              exit 1
            fi
            echo "EMULATOR_VALIDATION_SUCCESS"
      - name: Upload emulator validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Guardian-emulator-validation
          path: |
            emulator-validation.txt
            guardian-logcat.txt
          if-no-files-found: warn